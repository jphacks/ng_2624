<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ふぁみぽぽ ローカルデモ</title><link rel="stylesheet" href="/style.css"><script src="/demo.js" defer></script></head>
<body><div class="app"><main class="screen screen-form"><h1>ローカルデモ</h1><p>保護者1人・子ども1人、残高0円から始まります。会話・目標・お手伝いは空です。</p><p>このデモのデータはメモリ内だけに保存され、終了すると消えます。</p><p><button type="button" class="btn-pill" data-role="parent" disabled>保護者で入る</button> <button type="button" class="btn-pill" data-role="child" disabled>子どもで入る</button></p><p><a href="/">アプリへ戻る</a></p><h2>親子の接続を試す</h2><p>保護者で入り、子ども管理から招待を作成してください。別ブラウザーまたはプライベートウィンドウで招待URLを開き、通常の確認番号による接続手順を進めます。同じPC内で利用してください。</p><h2>最初からやり直す</h2><p>すべてのデモデータと、別ブラウザーでのログイン状態も初期化します。</p><button id="reset" class="btn-pill" type="button" disabled>デモを初期化する</button><p id="status" role="status" aria-live="polite"></p></main></div></body>
</html>
